spring:
  application:
    name: account-ai-agent
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:account-ai-agent/.env[.properties]
  ai:
    # Configuration LLM
    openai:
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL}
      chat:
        model: ${AI_CHAT_MODEL}
    # Connexion de l'agent au serveur mcp ms-account
    mcp:
      client:
        streamable-http:
          connections:
            account-mcp-server:
              url: http://localhost:8080

server:
  port: 8082
